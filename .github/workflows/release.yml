# Tests every push; a tag like v3 builds, signs and publishes the package Cake downloads from
# https://github.com/<owner>/cake-adapters/releases/latest/download/adapters.zip.
name: Adapters

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
        env:
          CAKE_ADAPTERS_KEY: ${{ secrets.CAKE_ADAPTERS_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" dist/adapters.zip --title "$GITHUB_REF_NAME" --notes "Adapter package $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
